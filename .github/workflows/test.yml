name: test

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

# Without this, every push spawns a full matrix that never supersedes the last.
# Runs then queue behind each other and get cancelled by contention rather than
# by intent, which reads as a test failure and is not one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ['20.x', '22.x', '24.x']
        # Windows is where path handling actually differs — separators, drive
        # letters, no /bin/sh. One version is enough to catch a regression
        # there; the Node matrix is about language features, not the platform.
        include:
          - os: windows-latest
            node: '22.x'
          - os: macos-latest
            node: '22.x'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # No dependencies by design, so there is nothing to install.
      - name: Unit and CLI smoke tests
        # test/cli-smoke.test.mjs spawns the real binary against a real
        # directory. Every bug that reached a user lived in a seam between
        # correct units, which is precisely what unit tests cannot see.
        #
        # No glob: neither PowerShell nor cmd.exe expands one for an external
        # command, so `test/*.test.mjs` reached node as a literal on Windows.
        # Node's own discovery is the portable spelling.
        run: node --test

  calibrate:
    # The panel's own scorer, run against a recorded lens output. Exits non-zero
    # if a planted defect goes unfound, so a regression in the merge or the
    # matching rules fails CI rather than quietly degrading a report.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Report round-trips a recorded run
        run: |
          printf '%s' '[{"lens":"check","output":"lib/a.js:41 — BLOCK — expires stored as a number, TTL index never fires — store a Date"},{"lens":"architect","output":"lib/a.js:41 — warning — Expires stored as a number so the TTL index never fires — store a Date"}]' > /tmp/run.json
          node bin/crosscheck.mjs report --in /tmp/run.json
      - name: Two lenses on one defect must merge to one consensus finding
        run: |
          node bin/crosscheck.mjs report --in /tmp/run.json > /tmp/out.txt
          grep -q 'CONSENSUS' /tmp/out.txt
          # One merged finding, not two: an exact-match merge would print both.
          test "$(grep -c 'lib/a.js' /tmp/out.txt)" = "1"
      - name: SARIF output is valid JSON at the expected version
        run: |
          node bin/crosscheck.mjs sarif --in /tmp/run.json --lenses lenses --out /tmp/out.sarif
          node -e "const s=require('node:fs').readFileSync('/tmp/out.sarif','utf8');const d=JSON.parse(s);if(d.version!=='2.1.0')throw new Error('bad version '+d.version);if(!d.runs[0].results.length)throw new Error('no results');console.log('sarif ok:',d.runs[0].results.length,'result(s)')"
